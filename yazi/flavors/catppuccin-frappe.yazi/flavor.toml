# vim:fileencoding=utf-8:foldmethod=marker
# One Dark (darker) — matched to kitty onedark.conf

# : Manager {{{

[mgr]
cwd = { fg = "#60AFEF" }

# Find
find_keyword  = { fg = "#E5C07A", bold = true, italic = true, underline = true }
find_position = { fg = "#C376DB", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#98C379", bg = "#98C379" }
marker_cut      = { fg = "#E06B75", bg = "#E06B75" }
marker_marked   = { fg = "#65C2CD", bg = "#65C2CD" }
marker_selected = { fg = "#E5C07A", bg = "#E5C07A" }

# Count
count_copied   = { fg = "#141414", bg = "#98C379" }
count_cut      = { fg = "#141414", bg = "#E06B75" }
count_selected = { fg = "#141414", bg = "#E5C07A" }

# Border
border_symbol = "│"
border_style  = { fg = "#4a5a6a" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#0d0d0d", bg = "#60AFEF", bold = true }
inactive = { fg = "#60AFEF", bg = "#1e1e1e" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#0d0d0d", bg = "#60AFEF", bold = true }
normal_alt  = { fg = "#60AFEF", bg = "#1e1e1e" }

# Select mode
select_main = { fg = "#0d0d0d", bg = "#65C2CD", bold = true }
select_alt  = { fg = "#65C2CD", bg = "#1e1e1e" }

# Unset mode
unset_main = { fg = "#0d0d0d", bg = "#E0C184", bold = true }
unset_alt  = { fg = "#E0C184", bg = "#1e1e1e" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#4a5a6a" }
perm_type  = { fg = "#60AFEF" }
perm_read  = { fg = "#E5C07A" }
perm_write = { fg = "#E06B75" }
perm_exec  = { fg = "#98C379" }

# Progress
progress_label  = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#98C379", bg = "#3E4451" }
progress_error  = { fg = "#E5C07A", bg = "#E06B75" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#4a5a6a" }
active   = { fg = "#C376DB", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#4a5a6a" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#4a5a6a" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#4a5a6a" }
title   = {}
hovered = { fg = "#C376DB", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#1e1e1e" }
cand            = { fg = "#65C2CD" }
rest            = { fg = "#5c6370" }
desc            = { fg = "#C376DB" }
separator       = "  "
separator_style = { fg = "#3E4451" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#65C2CD" }
run     = { fg = "#C376DB" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#1e1e1e", bg = "#BBC0CA" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#4a5a6a" }
title    = { fg = "#60AFEF" }
tbl_col  = { fg = "#65C2CD" }
tbl_cell = { fg = "#C376DB", bg = "#3E4451" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#98C379" }
title_warn  = { fg = "#E5C07A" }
title_error = { fg = "#E06B75" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#65C2CD" },
	# Media
	{ mime = "{audio,video}/*", fg = "#E5C07A" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#C376DB" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#98C379" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#5c6370" },
	# Fallback
	{ url = "*", fg = "#BBC0CA" },
	{ url = "*/", fg = "#60AFEF" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config",     text = "", fg = "#C376DB" },
	{ name = ".git",        text = "", fg = "#65C2CD" },
	{ name = ".github",     text = "", fg = "#60AFEF" },
	{ name = ".npm",        text = "", fg = "#60AFEF" },
	{ name = "Desktop",     text = "", fg = "#60afef" },
	{ name = "Development", text = "", fg = "#60afef" },
	{ name = "Documents",   text = "", fg = "#60afef" },
	{ name = "Downloads",   text = "", fg = "#60afef" },
	{ name = "Library",     text = "", fg = "#60afef" },
	{ name = "Movies",      text = "", fg = "#60afef" },
	{ name = "Music",       text = "", fg = "#60afef" },
	{ name = "Pictures",    text = "", fg = "#60afef" },
	{ name = "Public",      text = "", fg = "#60afef" },
	{ name = "Videos",      text = "", fg = "#60afef" },
]
conds = [
	# Special files
	{ if = "orphan",        text = "", fg = "#BBC0CA" },
	{ if = "link",          text = "", fg = "#4a5a6a" },
	{ if = "block",         text = "", fg = "#E0C184" },
	{ if = "char",          text = "", fg = "#E0C184" },
	{ if = "fifo",          text = "", fg = "#E0C184" },
	{ if = "sock",          text = "", fg = "#E0C184" },
	{ if = "sticky",        text = "", fg = "#E0C184" },
	{ if = "dummy",         text = "", fg = "#E06B75" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#60AFEF" },
	{ if = "dir",           text = "", fg = "#60AFEF" },
	{ if = "exec",          text = "", fg = "#98C379" },
	{ if = "!dir",          text = "", fg = "#BBC0CA" },
]
