# ── Font ──────────────────────────────────────────────────────
font_size 12.0
font_family      Maple Mono Normal NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto


# ── Window ────────────────────────────────────────────────────
window_padding_width  12
background_opacity 0.9
background_blur 32
hide_window_decorations yes


# ── Cursor ────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 1
cursor_beam_thickness 1.5
mouse_hide_wait       3.0

open_url_with default
detect_urls   yes


# ── Scrollback ───────────────────────────────────────────────
scrollback_lines 10000


# ── Terminal features ────────────────────────────────────────
copy_on_select clipboard
strip_trailing_spaces smart


# ── Layouts & splits ─────────────────────────────────────────
enabled_layouts       splits,tall,fat,grid,stack
remember_window_size  no
initial_window_width  170c
initial_window_height 45c
window_margin_width   0

inactive_text_alpha   0.65

window_border_width   0.5pt
active_border_color   #7f77dd
inactive_border_color #444441


# ── Tab bar ──────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    1

tab_title_template        " {index}: {title} "
active_tab_title_template " {index}: {title} "

active_tab_foreground   #1e1e2e
active_tab_background   #7f77dd
active_tab_font_style   bold
inactive_tab_foreground #888780
inactive_tab_background #2c2c2a
inactive_tab_font_style normal


# ── Bell & confirm ───────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0
confirm_os_window_close 0


# ── Performance (AMD Radeon 680M) ────────────────────────────
wayland_titlebar_color background
linux_display_server wayland
sync_to_monitor yes
repaint_delay   8
input_delay     2


# ══════════════════════════════════════════════════════════════
#  KEYBINDINGS — mặc định Kitty + thêm tiện ích
# ══════════════════════════════════════════════════════════════


# ── Tabs ─────────────────────────────────────────────────────
map ctrl+shift+t       new_tab_with_cwd
map ctrl+shift+q       close_tab
map ctrl+shift+right   next_tab
map ctrl+shift+left    previous_tab
map ctrl+shift+alt+t   set_tab_title
map ctrl+shift+1       goto_tab 1
map ctrl+shift+2       goto_tab 2
map ctrl+shift+3       goto_tab 3
map ctrl+shift+4       goto_tab 4
map ctrl+shift+5       goto_tab 5
map ctrl+shift+.       move_tab_forward
map ctrl+shift+,       move_tab_backward


# ── Windows (splits) — keybind mặc định ─────────────────────
map ctrl+shift+enter   new_window_with_cwd
map ctrl+shift+w       close_window
map ctrl+shift+]       next_window
map ctrl+shift+[       previous_window
map ctrl+shift+f       move_window_forward
map ctrl+shift+b       move_window_backward
map ctrl+shift+r       start_resizing_window
map ctrl+shift+l       next_layout

# Thêm: split có hướng cụ thể
map ctrl+shift+\       launch --cwd=current --location=vsplit
map ctrl+shift+-       launch --cwd=current --location=hsplit

# Thêm: zoom toggle
map ctrl+shift+z       toggle_layout stack


# ── Dev shortcuts ────────────────────────────────────────────
map ctrl+shift+g       launch --cwd=current --location=vsplit lazygit
map ctrl+shift+p       launch --cwd=current --location=hsplit htop
map ctrl+shift+e       launch --cwd=current --location=vsplit yazi


# ── Scrollback ───────────────────────────────────────────────
map ctrl+shift+/       show_scrollback
map ctrl+shift+up      scroll_line_up
map ctrl+shift+down    scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home    scroll_home
map ctrl+shift+end     scroll_end


# ── Font size ────────────────────────────────────────────────
map ctrl+equal         change_font_size all +1.0
map ctrl+minus         change_font_size all -1.0
map ctrl+0             change_font_size all 0


# ── Misc ─────────────────────────────────────────────────────
map ctrl+shift+f5      load_config_file
map ctrl+shift+f2      edit_config_file
map ctrl+shift+u       kitten unicode_input


# ── Theme ────────────────────────────────────────────────────
include dank-tabs.conf
include onedark.conf
